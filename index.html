<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.

  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Flight Token — one app for pilots and flight operations: weight & balance, performance, fleet management, and flight manifests in one place.">

  <!-- Open Graph / social & search previews -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Flight Token">
  <meta property="og:description" content="One app for pilots and flight operations: weight & balance, performance, fleet management, and flight manifests in one place.">
  <meta property="og:image" content="/icons/Icon-512.png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Flight Token">
  <meta name="twitter:description" content="One app for pilots and flight operations: weight & balance, performance, fleet management, and flight manifests in one place.">
  <meta name="twitter:image" content="/icons/Icon-512.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Flight Token">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
